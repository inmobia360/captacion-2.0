<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="cmcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#48cf38" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#0052ec" />
    </linearGradient>
    <style>
      @keyframes spinOrbit {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pulseLogo {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 1px rgba(72,207,56,0.5)); }
        50% { transform: scale(1.06); filter: drop-shadow(0 0 6px rgba(0,180,216,0.85)); }
      }
      .logo-image {
        animation: pulseLogo 2.5s ease-in-out infinite;
        transform-origin: 32px 32px;
      }
      .orbit-ring {
        animation: spinOrbit 3s linear infinite;
        transform-origin: 32px 32px;
      }
    </style>
  </defs>
  <!-- Aro orbital giratorio -->
  <circle class="orbit-ring" cx="32" cy="32" r="30" stroke="url(#cmcGrad)" stroke-width="2.5" stroke-dasharray="32 60" stroke-linecap="round" fill="none" opacity="0.9"/>
  <!-- Logo oficial CompraCaptación -->
  <g class="logo-image">
    <image href="data:image/png;base64," x="6" y="6" width="52" height="52" preserveAspectRatio="xMidYMid meet" />
  </g>
</svg>
