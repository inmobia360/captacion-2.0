<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1D4ED8">
  <title>Sin Conexión · Compra Captación</title>
  <style>
    :root {
      --bg: #0B1528;
      --card-bg: #111F38;
      --border: #1E293B;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --blue: #2563EB;
      --blue-light: #3B82F6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .icon {
      font-size: 3rem;
      margin-bottom: 1rem;
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.02em;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.875rem;
      line-height: 1.5;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.875rem 1.5rem;
      background-color: var(--blue);
      color: #fff;
      font-size: 0.875rem;
      font-weight: 700;
      border-radius: 0.75rem;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn:hover {
      background-color: var(--blue-light);
      transform: translateY(-1px);
    }
    .btn:active {
      transform: translateY(0);
    }
    .tips {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px solid var(--border);
      text-align: left;
    }
    .tips-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
    }
    .tips-list {
      font-size: 0.75rem;
      color: var(--text-muted);
      list-style-position: inside;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">📶</div>
    <h1>Modo sin conexión</h1>
    <p>No tienes acceso a internet en este momento. La plataforma se reconectará automáticamente en cuanto recuperes cobertura.</p>
    <button type="button" class="btn" onclick="window.location.reload()">Reintentar conexión ↻</button>
    <div class="tips">
      <div class="tips-title">Mientras tanto:</div>
      <ul class="tips-list">
        <li>Comprueba tu conexión Wi-Fi o datos móviles.</li>
        <li>Si instalaste la App PWA, tus datos cacheados seguirán disponibles.</li>
      </ul>
    </div>
  </main>
</body>
</html>
